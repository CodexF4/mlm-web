<div class="dark:bg-gray-950">
  <header class="bg-linear-to-b from-primary to-primary-100 h-30 w-full">
    <div class="xl:w-300 mx-auto">
      <nav class="flex justify-between mb-2">
        <div class="flex items-center">
          <a class="link text-[13px]" href="/">Earn from Referral</a>
          <div class="border-r h-3 border-gray-200"></div>
          <a class="link text-[13px]" href="/">Join Our Community</a>
          <div class="border-r h-3 border-gray-200"></div>
          <div class="link text-[13px]"> Follow us on
            <a href="/"><i class="fa-brands fa-facebook text-white"></i></a>
          </div>
        </div>
        <div class="flex items-center">
          @if (currentUser(); as user) {
            <a class="text-[13px] link font-semibold" routerLink="/referrals">Referrals</a>
            <div class="border-r h-3 border-gray-200"></div>
            <a class="text-[13px] link font-semibold" routerLink="/network">Network</a>
            <div class="border-r h-3 border-gray-200"></div>
            <span class="text-[13px] link font-semibold">Hi, {{ user.firstName }}</span>
            <div class="border-r h-3 border-gray-200"></div>
            <button type="button" class="text-[13px] link font-semibold" (click)="logout()">Logout</button>
          } @else {
            <a class="text-[13px] link font-semibold" routerLink="/register">Sign Up</a>
            <div class="border-r h-3 border-gray-200"></div>
            <a class="text-[13px] link font-semibold" routerLink="/login">Login</a>
          }
        </div>
      </nav>
      <div class="flex justify-between items-center">
        <a routerLink="/" class="flex items-center px-2">
          <img class="h-13.75 w-13.75" src="logo-white.svg" alt="Pag-Unlad Logo">
          <div class="font-roboto text-white text-[30px]">Pag-Unlad</div>
        </a>
        <div class="px-2 ">
          <i class="cart fa-solid fa-cart-shopping text-white text-4xl "></i>
          <!-- <i class="fa-solid fa-bag-shopping text-white"></i> -->
        </div>
      </div>
    </div>
  </header>
  <main>
    <router-outlet />
  </main>
</div>
