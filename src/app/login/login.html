<section class="bg-linear-to-b from-primary to-primary-100">
  <div class="xl:w-300 mx-auto px-4 py-10 md:py-16 flex flex-col md:flex-row items-center md:justify-between gap-10">
    <!-- Brand / promo (desktop) -->
    <div class="hidden md:flex flex-col items-center text-white text-center max-w-sm">
      <a routerLink="/" aria-label="Home"><img src="logo-white.svg" alt="Pag-Unlad" class="h-28 w-28 mb-4" /></a>
      <h2 class="font-roboto text-4xl font-bold">Pag-Unlad</h2>
      <p class="text-white/90 mt-2 text-lg">Sell, Refer, Succeed Online</p>
      <ul class="mt-6 space-y-2 text-white/90 text-sm text-left">
        <li><i class="fa-solid fa-check mr-2"></i>Earn from every referral</li>
        <li><i class="fa-solid fa-check mr-2"></i>Shop at member prices</li>
        <li><i class="fa-solid fa-check mr-2"></i>Grow your own network</li>
      </ul>
    </div>

    <!-- Form card -->
    <div class="w-full max-w-sm bg-white dark:bg-gray-900 rounded shadow-xl p-6 md:p-8">
      <h1 class="font-roboto text-xl font-medium text-gray-800 dark:text-white mb-6">Log in</h1>

      <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-3">
        <label class="field">
          <span>Username or email</span>
          <input type="text" formControlName="usernameOrEmail" autocomplete="username" />
        </label>

        <label class="field">
          <span>Password</span>
          <input type="password" formControlName="password" autocomplete="current-password" />
        </label>

        @if (error()) {
          <p class="text-sm text-red-600 dark:text-red-400">{{ error() }}</p>
        }

        <button type="submit" [disabled]="submitting()" class="btn-primary w-full mt-1">
          {{ submitting() ? 'Logging in…' : 'Log in' }}
        </button>
      </form>

      <div class="flex items-center gap-3 my-5 text-xs text-gray-400">
        <span class="h-px bg-gray-200 dark:bg-gray-700 flex-1"></span>
        OR
        <span class="h-px bg-gray-200 dark:bg-gray-700 flex-1"></span>
      </div>

      <div class="flex flex-col items-center gap-3">
        <app-google-signin (credential)="onGoogle($event)" />
        <a routerLink="/auth/facebook"
           class="w-full flex items-center justify-center gap-2 border border-gray-300 dark:border-gray-700 rounded-[2px] py-2 text-sm text-gray-700 dark:text-white hover:bg-gray-50 dark:hover:bg-gray-800">
          <i class="fa-brands fa-facebook text-blue-600"></i> Continue with Facebook
        </a>
      </div>

      <p class="text-center text-sm text-gray-500 dark:text-white mt-6">
        New to Pag-Unlad?
        <a routerLink="/register" class="text-primary font-semibold hover:underline">Sign Up</a>
      </p>
    </div>
  </div>
</section>
