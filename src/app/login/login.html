<div class="mx-auto max-w-md px-4 py-10">
  <h1 class="font-roboto text-2xl font-semibold text-primary dark:text-white mb-1">Log in</h1>
  <p class="text-sm text-gray-500 dark:text-white mb-6">Welcome back to Pag-Unlad.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-3">
    <label class="field">
      <span>Username or email</span>
      <input type="text" formControlName="usernameOrEmail" autocomplete="username" />
    </label>

    <label class="field">
      <span>Password</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>

    @if (error()) {
      <p class="text-sm text-red-600 dark:text-red-400">{{ error() }}</p>
    }

    <button type="submit" [disabled]="submitting()" class="btn-primary">
      {{ submitting() ? 'Logging in…' : 'Log in' }}
    </button>
  </form>
</div>
