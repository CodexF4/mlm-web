# Netlify configuration for the Angular 21 SSR app.

[build]
  command = "npm run build"
  # Static browser assets; @netlify/angular-runtime (a devDependency) wires up the SSR
  # function automatically — no [[plugins]] entry, which would load Netlify's older
  # managed version and fail the Angular 21 SSR version check.
  publish = "dist/mlm/browser"

[build.environment]
  # @netlify/angular-runtime v4 requires Node >= 22.22 / 24.13.
  NODE_VERSION = "24"

# Same-origin API proxy: the browser only ever talks to the Netlify origin, so the
# httpOnly auth cookie stays first-party. Replace the target with your Render API URL.
# This runs before the SSR function, so /api/* never hits Angular.
[[redirects]]
  from = "/api/*"
  to = "https://mlm-api.onrender.com/:splat"
  status = 200
  force = true

# SPA fallback: the root and other client-rendered routes have no prerendered
# index.html (SSR output names the client shell index.csr.html). `force` stays false
# so prerendered static files (e.g. /community, /earn) are served directly and only
# unmatched paths fall through to the client shell.
# NOTE: this serves the client shell for everything not prerendered, so it bypasses the
# SSR function. If you later add a RenderMode.Server route, exclude its path from this
# rule (or route it to the SSR function) so it actually server-renders.
[[redirects]]
  from = "/*"
  to = "/index.csr.html"
  status = 200
